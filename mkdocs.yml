site_name: Steel Energy Regimes and Anomalies
site_description: Unsupervised analysis of operating regimes and unusual energy-consumption observations in a steel industry dataset.
repo_url: https://github.com/MBA-Data-Science-Unifor/Regime-Anomaly-Unsupervisioned
repo_name: Regime-Anomaly-Unsupervisioned

nav:
  - Overview: index.md
  - Problem Understanding: business-understanding.md
  - Methodology: methodology.md
  - Success Criteria: success-criteria.md
  - Data:
      - Source: data-source.md
      - Understanding: data-understanding.md
      - Initial Findings: initial-findings.md
      - Preparation: data-preparation.md
  - Analysis:
      - Exploratory Analysis: exploratory-analysis.md
      - Modeling: modeling.md
      - Evaluation: evaluation.md
      - Team Review: team-review.md
  - Delivery:
      - Implementation: implementation.md
      - Project Structure: project-analysis.md
      - Status: status.md
      - Technical References: references.md
  - PBL Journey:
      - Problem Canvas: pbl/problem-canvas.md
      - PBL Board: pbl/pbl-board.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          site_name: Regimes e Anomalias de Energia Siderúrgica
          site_description: Análise não supervisionada de regimes operacionais e observações incomuns de consumo energético em uma indústria siderúrgica.
          theme:
            language: pt-BR
          nav_translations:
            Overview: Visão geral
            Problem Understanding: Entendimento do problema
            Methodology: Metodologia
            Success Criteria: Critérios de sucesso
            Data: Dados
            Source: Fonte
            Understanding: Entendimento
            Initial Findings: Descobertas iniciais
            Preparation: Preparação
            Analysis: Análise
            Exploratory Analysis: Análise exploratória
            Modeling: Modelagem
            Evaluation: Avaliação
            Team Review: Revisão da equipe
            Delivery: Entrega
            Implementation: Implementação
            Project Structure: Estrutura do projeto
            Status: Situação
            Technical References: Referências técnicas
            PBL Journey: Jornada PBL
            Problem Canvas: Canvas do problema
            PBL Board: Quadro PBL

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: custom
      accent: custom
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/css/fonts.css
  - assets/css/brand.css
  - assets/css/tables.css

