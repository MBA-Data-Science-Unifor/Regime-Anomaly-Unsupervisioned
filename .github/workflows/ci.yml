name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and quality
    # Keep the runner image stable instead of inheriting a new ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect quality-relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ -z "$EVENT_BEFORE" || "$EVENT_BEFORE" =~ ^0+$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          else
            base_sha="$EVENT_BEFORE"
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf ' - %s\n' "${changed_files[@]}"

          run_quality=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              .github/workflows/* | src/* | tests/* | docs/* | \
              pyproject.toml | uv.lock | uv.toml | .python-version | \
              requirements.txt | tasks.py | mkdocs.yml | README.md)
                run_quality=true
                break
                ;;
            esac
          done

          echo "run_quality=$run_quality" >> "$GITHUB_OUTPUT"

      - name: Validate notebook JSON
        if: steps.changes.outputs.run_quality != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' notebooks < <(find artifacts/notebooks -type f -name '*.ipynb' -print0)
          for notebook in "${notebooks[@]}"; do
            echo "Validating $notebook"
            python3 -m json.tool "$notebook" > /dev/null
          done

      - name: Install uv
        if: steps.changes.outputs.run_quality == 'true'
        # setup-uv does not publish a floating v10 tag. Pin the official v10.3.3 commit.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          require-checksums: true
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        if: steps.changes.outputs.run_quality == 'true'
        run: uv python install 3.12

      - name: Sync locked environment
        if: steps.changes.outputs.run_quality == 'true'
        run: uv sync --locked --group dev --group test --group docs

      - name: Check formatting and lint
        if: steps.changes.outputs.run_quality == 'true'
        run: |
          uv run ruff format --check src tests tasks.py
          uv run ruff check src tests tasks.py

      - name: Check types
        if: steps.changes.outputs.run_quality == 'true'
        run: uv run mypy

      - name: Run tests with coverage
        if: steps.changes.outputs.run_quality == 'true'
        run: uv run pytest --cov=regime_anomaly --cov-report=term-missing

      - name: Build documentation
        if: steps.changes.outputs.run_quality == 'true'
        run: uv run invoke docs --build --strict

      - name: Build Python package
        if: steps.changes.outputs.run_quality == 'true'
        run: uv build